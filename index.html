<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ИИ Фося</title>
    <style>
        body { background: #0d0d0d; color: #00ffcc; font-family: monospace; padding: 20px; }
        .chat { height: 60vh; border: 1px solid #0f0; overflow-y: auto; padding: 10px; margin-bottom: 10px; }
        .msg { margin: 5px 0; padding: 5px; }
        .user { color: #fff; text-align: right; }
        .ai { color: #0f0; }
        input { width: 70%; padding: 10px; background: #000; color: #0f0; border: 1px solid #0f0; }
        button { padding: 10px; background: #0f0; color: #000; border: none; font-weight: bold; }
        #adminToggle { display: none; } /* Скрытая кнопка */
    </style>
</head>
<body>
    <h2>🤖 ИИ Фося</h2>
    <div class="chat" id="chat"></div>
    <input type="text" id="input" placeholder="Напиши Фосе...">
    <button onclick="send()">Отправить</button>

    <!-- Секретная кнопка для тебя. Чтобы включить режим Фоси, нажми 5 раз на заголовок -->
    <button id="adminToggle" onclick="toggleAdmin()">Режим Фоси</button>

    <script src="https://cdn.jsdelivr.net/npm/webconnect/dist/umd/webconnect.js"></script>
    <script>
        const chat = document.getElementById('chat');
        const input = document.getElementById('input');
        const adminToggle = document.getElementById('adminToggle');
        let isAdmin = false;
        let connect;

        // Секретный вход (5 кликов по заголовку)
        let clickCount = 0;
        document.querySelector('h2').addEventListener('click', () => {
            clickCount++;
            if (clickCount >= 5) {
                adminToggle.style.display = 'block';
                alert("Режим Фоси разблокирован! Нажми на кнопку ниже.");
                clickCount = 0;
            }
        });

        function toggleAdmin() {
            isAdmin = !isAdmin;
            adminToggle.textContent = isAdmin ? "Ты — Фося (Админ)" : "Ты — Пользователь";
            alert(isAdmin ? "Теперь ты Фося. Отвечай на сообщения!" : "Теперь ты пользователь.");
        }

        // Инициализация соединения
        // appName и channelName должны быть уникальными, чтобы вас не нашли другие
        connect = webconnect({
            appName: "fosya-ai",
            channelName: "fosya-chat-123" // Придумай свой пароль
        });

        connect.onConnect((attr) => {
            console.log("Соединение установлено:", attr.connectId);
        });

        connect.onReceive((data, attr) => {
            const msgDiv = document.createElement('div');
            msgDiv.className = 'msg user';
            msgDiv.innerText = data;
            chat.appendChild(msgDiv);
            chat.scrollTop = chat.scrollHeight;
        });

        function send() {
            const text = input.value;
            if (!text) return;

            if (isAdmin) {
                // Ты (Фося) отправляешь сообщение
                connect.Send("Фося: " + text, {});
                const msgDiv = document.createElement('div');
                msgDiv.className = 'msg ai';
                msgDiv.innerText = "Фося: " + text;
                chat.appendChild(msgDiv);
            } else {
                // Пользователь отправляет сообщение
                connect.Send("Ты: " + text, {});
                const msgDiv = document.createElement('div');
                msgDiv.className = 'msg user';
                msgDiv.innerText = "Ты: " + text;
                chat.appendChild(msgDiv);
            }
            input.value = '';
            chat.scrollTop = chat.scrollHeight;
        }

        input.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') send();
        });
    </script>
</body>
</html>
